[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-paper-answer-bot"
version = "0.1.0"
description = "RAG chatbot over GenAI/LLM research papers"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # ── Database ───────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # ── Config / Validation ────────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── LangChain / RAG ────────────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",

    # ── Embeddings ─────────────────────────────────────────────────────────
    # sentence-transformers for BAAI/bge-m3 (local, CPU-only is fine)
    "sentence-transformers>=3.0.0",
    "torch>=2.0",
    "openai>=1.40.0",           # NVIDIA NIM embedding API (OpenAI-compatible)

    # ── PDF Processing ─────────────────────────────────────────────────────
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",

    # ── Utilities ──────────────────────────────────────────────────────────
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "tqdm>=4.65.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]
eval = [
    # Evaluation deps — install separately if needed
    # pip install -e ".[eval]"
    "ragas>=0.1.0",
    "datasets>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
